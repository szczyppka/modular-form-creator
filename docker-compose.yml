services:
  backend:
    build: ./backend
    container_name: modular-form-creator-backend
    ports:
      - '5001:5001'
    environment:
      PORT: '5001'
      MONGO_URI: 'mongodb://mongo:27017/modular_form_creator'
      CORS_ORIGIN: 'http://localhost:5173'
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: modular-form-creator-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  frontend:
    image: node:22-alpine
    container_name: modular-form-creator-frontend
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: 'http://localhost:5001'
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  mongo_data:
